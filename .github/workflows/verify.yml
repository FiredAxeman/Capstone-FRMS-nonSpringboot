name: Verify capstone

on:
  push:
    branches: [master, main, 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Style, unit, integration, system tests, and runnable JAR
        run: mvn -B verify
      - name: Smoke-test packaged application
        run: java -jar target/flight-duty-frms-1.0.0.jar --headless --database "$RUNNER_TEMP/frms-smoke.sqlite"
      - uses: actions/upload-artifact@v7
        if: matrix.java == '17'
        with:
          name: frms-capstone
          path: |
            target/flight-duty-frms-1.0.0.jar
            target/surefire-reports/
